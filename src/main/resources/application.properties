spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scheduler}
spring.datasource.username=${DATABASE_USER:scheduler}
spring.datasource.password=${DATABASE_PASSWORD:scheduler}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt-secret=${JWT_SECRET}
server.error.include-message=always
