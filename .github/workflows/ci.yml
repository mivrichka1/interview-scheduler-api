name: Java CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scheduler_test
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test against PostgreSQL
        run: mvn -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/scheduler_test
          TEST_DATABASE_USER: scheduler
          TEST_DATABASE_PASSWORD: scheduler
